name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        django: ["4.2.*", "5.2.*"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run tests
        run: >
          uv run --no-project --python ${{ matrix.python }}
          --with "django==${{ matrix.django }}" --with pytest --with pytest-django
          python -m pytest
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
